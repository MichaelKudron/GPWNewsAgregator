# Nakładka DEV — publikuje porty backendów na hosta do debugowania.
# NIE ładuje się automatycznie (celowo — inaczej serwer też by je odsłaniał).
#
# Lokalnie:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Serwer:    docker compose up          (sam base = tylko frontend publiczny)
services:
  postgres:
    ports:
      - "5433:5432"   # dockerowa baza na 5433 (5432 zostaje dla natywnego Postgresa)
  newsdownload:
    ports:
      - "8003:8003"
  analysis:
    ports:
      - "8004:8004"
  companyservice:
    ports:
      - "18081:8081"   # host 18081 (8081 bywa zarezerwowany przez WinNAT na Windows)
  gateway:
    ports:
      - "18080:8080"   # host 18080 (8080 j.w.); dev-front woła localhost:18080
